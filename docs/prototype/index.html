<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitViz 原型</title>
<style>
:root{--bg:#F7F7F6;--ink:#1F1F1E;--muted:#5C5C58;--line:#DADAD6;--card:#FFFFFF;--accent:#C2570C}
@media (prefers-color-scheme:dark){:root{--bg:#1B1B1B;--ink:#EAEAE8;--muted:#A8A8A4;--line:#3A3A3A;--card:#232323;--accent:#F08A3C}}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,'PingFang SC','Helvetica Neue',sans-serif}
main{max-width:720px;margin:0 auto;padding:48px 16px}
h1{font-size:24px;margin:0 0 6px}
p{margin:0 0 28px;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:inherit;text-decoration:none}
a:hover{border-color:var(--accent)}
code{font:12px Menlo,ui-monospace,monospace;color:var(--muted)}
h2{font-size:13px;font-weight:600;color:var(--muted);margin:28px 0 10px}
</style>
</head>
<body>
<main>
  <h1>GitViz 原型</h1>
  <p>直接在浏览器里打开就行。配色和明暗在设置页或配色方案页里改，所有页面共用。</p>
  <ul>
    <li><a href="Main.dc.html">主窗口 · 提交历史 <code>Main.dc.html</code></a></li>
    <li><a href="Welcome.dc.html">欢迎页 · 打开仓库 <code>Welcome.dc.html</code></a></li>
    <li><a href="Conflict.dc.html">解决合并冲突 <code>Conflict.dc.html</code></a></li>
    <li><a href="Settings.dc.html">设置 <code>Settings.dc.html</code></a></li>
  </ul>
  <h2>已隐藏</h2>
  <ul>
    <li><a href="Schemes.dc.html">配色方案 <code>Schemes.dc.html</code></a></li>
  </ul>
</main>
</body>
</html>
